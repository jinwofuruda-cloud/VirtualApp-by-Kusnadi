name: Android CI Build

on:
  push:
    branches: [ main, master, dev ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '21'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: Verify Java version
      run: |
        echo "Java version:"
        java -version
        echo "JAVA_HOME: $JAVA_HOME"
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Build Debug APK
      if: github.event.inputs.build_type != 'release'
      run: |
        echo "📦 Building Debug APK..."
        ./gradlew assembleDebug --stacktrace --no-daemon
      continue-on-error: false
      
    - name: Build Release APK
      if: github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/')
      run: |
        echo "📦 Building Release APK..."
        ./gradlew assembleRelease --stacktrace --no-daemon
      continue-on-error: false
      
    - name: Find all APK files
      id: find_apk
      run: |
        echo "🔍 Finding APK files..."
        APK_PATHS=$(find . -name "*.apk" -type f | head -20)
        echo "$APK_PATHS"
        
        if [ -z "$APK_PATHS" ]; then
          echo "⚠️ No APK files found!"
          exit 1
        fi
        
        # Set output dengan path APK
        echo "apk_paths<<EOF" >> $GITHUB_OUTPUT
        echo "$APK_PATHS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/**/*.apk
        if-no-files-found: warn
        
    - name: Upload Release APK
      if: github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: |
          **/build/outputs/apk/release/*.apk
          **/build/outputs/apk/**/*.apk
        if-no-files-found: warn
        
    - name: Upload Build Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-reports
        path: |
          **/build/reports/
          build/reports/
        if-no-files-found: warn
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/') && success()
      uses: softprops/action-gh-release@v2
      with:
        files: |
          **/build/outputs/apk/release/*.apk
          **/build/outputs/apk/**/*.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload to Telegram
      if: always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          🏗️ Build ${{ job.status }}!
          
          📦 Repository: ${{ github.repository }}
          🌿 Branch: ${{ github.ref_name }}
          🔧 Java: ${{ env.JAVA_VERSION }}
          
          ${{ job.status == 'success' && '✅ Build berhasil!' || '❌ Build gagal!' }}
          
          🔗 Lihat detail: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run Lint Check
      run: |
        echo "🔍 Running lint check..."
        ./gradlew lint --stacktrace --no-daemon
      continue-on-error: true
      
    - name: Upload Lint Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-report
        path: |
          **/build/reports/lint-results*
          app/build/reports/
        if-no-files-found: warn
