name: Android Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          
      - name: Install NDK
        run: |
          cd $ANDROID_SDK_ROOT
          echo "y" | sdkmanager --install "ndk;29.0.13846066" --channel=0
          
      - name: Set NDK environment variable
        run: echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/29.0.13846066" >> $GITHUB_ENV
        
      - name: Make gradlew executable
        run: chmod +x ./gradlew
        
      - name: Build with Gradle
        run: ./gradlew clean build
        
      - name: Build Release APK
        run: ./gradlew :app:assembleRelease
        
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: app/build/outputs/apk/
          retention-days: 7
          
      - name: Run Unit Tests
        run: ./gradlew test
        
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            Bcore/build/reports/tests/
          retention-days: 7
          
      - name: Build Lint Report
        run: ./gradlew lint
        
      - name: Upload Lint Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results*.html
            Bcore/build/reports/lint-results*.html
          retention-days: 7
